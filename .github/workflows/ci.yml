name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Advisories are published without any change on our side.
  schedule:
    - cron: '30 3 * * 1'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Reads the pnpm version from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Start MongoDB and Redis
        run: docker compose up -d --wait

      - name: Integration tests
        run: pnpm test:e2e

      - name: Build
        run: pnpm build
        env:
          # The web app's /api/v1 rewrite is fixed at build time. The browser
          # tests below run the API on this port (apps/web/playwright.config.ts).
          API_ORIGIN: http://localhost:4200

      # Accessibility (axe), layout at 360/768/1280px, keyboard use, link
      # checks and the sign-up, verification, sign-in and password reset
      # journeys, in a real browser against the built web app, API and worker.
      - name: Install Playwright browser
        run: pnpm --filter @my-marriage/web exec playwright install --with-deps chromium

      # Serves the production builds from the Build step, with MongoDB and
      # Redis from the step above (see playwright.config.ts).
      - name: Browser tests
        run: pnpm test:browser

      - name: Upload browser test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

      # The committed contract must match what the API code generates.
      - name: OpenAPI contract is up to date
        run: |
          pnpm contracts:generate
          git diff --exit-code -- packages/contracts || {
            echo "::error::packages/contracts is stale. Run 'pnpm contracts:generate' and commit the result."
            exit 1
          }

  # Separate from `verify` so a newly published advisory is visible as its own
  # failure instead of masking the result of the code checks.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Dependency audit (production dependencies, high and above)
        run: pnpm audit --prod --audit-level high
